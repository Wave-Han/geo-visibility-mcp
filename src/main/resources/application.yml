spring:
  main:
    web-application-type: none
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: geo-visibility-mcp
        version: 0.1.0

geo:
  data-dir: ./data
  engines:
    - name: deepseek
      type: responses
      layer: search
      base-url: https://api.deepseek.com/v1
      model: deepseek-v4-flash
      api-key-env: DEEPSEEK_API_KEY
      enabled: true
    - name: zhipu
      type: compat
      layer: memory            # glm-4-flash does not execute web_search (verified by probe)
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-flash
      api-key-env: ZHIPU_API_KEY
      enabled: true
      extra-body:
        tools:
          - type: web_search
            web_search:
              enable: true
              search_result: true
  measure:
    concurrency: 4
    retries: 2
