spring:
  main:
    web-application-type: none
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: geo-visibility-mcp
        version: 0.1.0

geo:
  data-dir: ./data
  engines:
    - name: deepseek
      type: responses
      layer: search
      base-url: https://api.deepseek.com/v1
      model: deepseek-v4.1-flash   # switched 2026-11-02 (baseline Oct used v4-flash; v4.1 GA since 2026-09)
      api-key-env: DEEPSEEK_API_KEY
      enabled: true
    - name: zhipu
      type: compat
      # glm-5.3-flash executes web_search (probe 2026-11-02, grounded) = search layer.
      # Earlier glm-4-flash "memory" verdict was measured with a malformed tools body
      # (Spring binding bug, fixed same day) - treat that verdict as unverified.
      layer: search
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-5.3-flash
      api-key-env: ZHIPU_API_KEY
      enabled: true
      extra-body:
        tools:
          - type: web_search
            web_search:
              enable: true
              search_result: true
  measure:
    concurrency: 4
    retries: 2
