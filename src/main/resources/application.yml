spring:
  main:
    web-application-type: none
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: geo-visibility-mcp
        version: 0.1.0

geo:
  data-dir: ./data
  engines:
    - name: deepseek
      type: responses
      layer: search
      base-url: https://api.deepseek.com/v1
      model: deepseek-flash   # API rejects "deepseek-v4.1-flash" (400, 2026-11-02): supported
                              # names are deepseek-flash, deepseek-v4-pro; baseline Oct used v4-flash
      api-key-env: DEEPSEEK_API_KEY
      enabled: true
    - name: zhipu
      type: compat
      # glm-5.3-flash executes web_search (probe 2026-11-02, grounded) = search layer.
      # glm-4-flash answered from memory even with a well-formed body (verified via
      # the Python probe_zhipu.py, 2026-10-31) - the layer flipped with the model
      # generation, not with the Java binding bug (which was Java-only and never
      # measured glm-4-flash). Add a glm-4-flash engine entry to keep a memory layer.
      layer: search
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-5.3-flash
      api-key-env: ZHIPU_API_KEY
      enabled: true
      extra-body:
        tools:
          - type: web_search
            web_search:
              enable: true
              search_result: true
    - name: zhipu-glm4
      type: compat
      # Memory layer: glm-4-flash answers from memory even with web_search attached
      # (probe_zhipu.py, 2026-10-31); tool kept to match the Python baseline method.
      layer: memory
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-flash
      api-key-env: ZHIPU_API_KEY
      enabled: true
      extra-body:
        tools:
          - type: web_search
            web_search:
              enable: true
              search_result: true
  measure:
    concurrency: 4
    retries: 2
